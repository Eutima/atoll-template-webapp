<c-layout title="Home">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    {% if user.is_authenticated %}
      <h1 class="mb-2 text-lg font-semibold text-gray-900">Welcome back</h1>
      <p class="mb-4 text-sm text-gray-500">Logged in as {{ user.email }}</p>
      <form method="post" action="{% url 'authentication:logout' %}">
        {% csrf_token %}
        <button
          type="submit"
          class="w-full rounded-md bg-gray-200 px-3 py-2 text-sm font-medium text-gray-800 hover:bg-gray-300"
        >
          Log out
        </button>
      </form>
    {% else %}
      <h1 class="mb-4 text-lg font-semibold text-gray-900">Django Template</h1>
      <a
        href="{% url 'authentication:login' %}"
        class="block w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
      >
        Log in
      </a>
    {% endif %}
  </div>
</c-layout>

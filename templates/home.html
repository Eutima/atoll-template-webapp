<c-layout title="Home">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-2 text-lg font-semibold text-gray-900">Home</h1>

    {% if helix_user %}
      <p class="mb-4 text-sm text-gray-500">Signed in as {{ helix_user.email }}</p>
      <form method="post" action="{% url 'authentication:logout' %}">
        {% csrf_token %}
        <button type="submit" class="w-full rounded-md bg-gray-100 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200">
          Log out
        </button>
      </form>
    {% elif helix_configured %}
      <p class="mb-4 text-sm text-gray-500">You're not signed in.</p>
      <a
        href="{% url 'authentication:helix-login' %}"
        class="block w-full rounded-md bg-indigo-600 px-3 py-2 text-center text-sm font-medium text-white hover:bg-indigo-500"
      >
        Log in with Helix
      </a>
    {% endif %}
  </div>
</c-layout>

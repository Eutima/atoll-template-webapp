<c-layout title="Sign up">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Sign up</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_email">Email</label>
        <input
          id="id_email" name="email" type="email" required
          value="{{ serializer.initial_data.email|default:'' }}"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        {% for error in serializer.errors.email %}
          <p class="mt-1 text-sm text-red-600">{{ error }}</p>
        {% endfor %}
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_password">Password</label>
        <input
          id="id_password" name="password" type="password" required
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
        {% for error in serializer.errors.password %}
          <p class="mt-1 text-sm text-red-600">{{ error }}</p>
        {% endfor %}
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_first_name">First name</label>
        <input
          id="id_first_name" name="first_name" type="text"
          value="{{ serializer.initial_data.first_name|default:'' }}"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_last_name">Last name</label>
        <input
          id="id_last_name" name="last_name" type="text"
          value="{{ serializer.initial_data.last_name|default:'' }}"
          class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>
      <button type="submit" class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500">
        Sign up
      </button>
    </form>

    <p class="mt-4 text-sm text-gray-500">
      Already have an account? <a class="text-indigo-600 hover:underline" href="{% url 'authentication:login' %}">Log in</a>
    </p>
  </div>
</c-layout>

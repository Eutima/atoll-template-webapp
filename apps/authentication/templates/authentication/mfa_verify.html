<c-layout title="Verify MFA">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Enter your code</h1>

    {% if errors %}
      {% for field_errors in errors.values %}
        {% for error in field_errors %}
          <p class="mb-3 text-sm text-red-600">{{ error }}</p>
        {% endfor %}
      {% endfor %}
    {% endif %}

    <form method="post" class="space-y-3 text-left">
      {% csrf_token %}
      <div>
        <label for="id_code" class="block text-sm font-medium text-gray-700">
          Authenticator code or backup code
        </label>
        <input
          type="text"
          name="code"
          id="id_code"
          required
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
        />
      </div>
      <button
        type="submit"
        class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
      >
        Verify
      </button>
    </form>
  </div>
</c-layout>

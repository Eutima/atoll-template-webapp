<c-layout title="MFA backup codes">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">MFA is enabled</h1>
    <p class="mb-4 text-sm text-gray-600">
      Save these one-time backup codes somewhere safe. Each one can be used once if you lose access to
      your authenticator app. They will not be shown again.
    </p>
    <ul class="mb-4 space-y-1 rounded-md bg-gray-50 p-3 font-mono text-sm text-gray-900">
      {% for backup_code in backup_codes %}
        <li>{{ backup_code }}</li>
      {% endfor %}
    </ul>
    <a
      href="{% url 'home' %}"
      class="block w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
    >
      Done
    </a>
  </div>
</c-layout>

<c-layout title="MFA">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">MFA is on</h1>
    <p class="mb-4 text-sm text-gray-600">
      Multi-factor authentication is enabled for your account.
    </p>
    <form method="post" action="{% url 'authentication:mfa-disable' %}">
      {% csrf_token %}
      <button
        type="submit"
        class="w-full rounded-md bg-red-600 px-3 py-2 text-sm font-medium text-white hover:bg-red-500"
      >
        Disable MFA
      </button>
    </form>
  </div>
</c-layout>

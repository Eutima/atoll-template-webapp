<c-layout title="Searchable select demo">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Find a user</h1>
    <c-searchable-select
      name="user_profile"
      label="User"
      search-url="{% url 'demo:searchable-select-search' %}"
      placeholder="Search by name or email..."
    />
  </div>
</c-layout>

<c-layout title="Access denied">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Access denied</h1>
    <p class="text-sm text-gray-500">
      Your Helix account isn't a member of the workspace this app is configured for.
      Contact your administrator if you believe this is a mistake.
    </p>
    <a href="{% url 'authentication:login' %}" class="mt-4 inline-block text-sm text-indigo-600 hover:underline">
      Back to login
    </a>
  </div>
</c-layout>

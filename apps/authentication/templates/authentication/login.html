<c-layout title="Log in">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm text-center">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Log in</h1>

    {% if messages %}
      {% for message in messages %}
        <p class="mb-3 text-sm text-red-600">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <a
      href="{% url 'authentication:helix-login' %}"
      class="block w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500"
    >
      Log in with Helix
    </a>
  </div>
</c-layout>

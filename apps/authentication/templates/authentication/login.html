<c-layout title="Log in">
  <div class="mx-auto mt-24 max-w-sm rounded-md border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-lg font-semibold text-gray-900">Log in</h1>

    {% if form.errors %}
      <p class="mb-3 text-sm text-red-600">Your email or password is incorrect.</p>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_username">Email</label>
        {{ form.username }}
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700" for="id_password">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-500">
        Log in
      </button>
    </form>

    <p class="mt-4 text-sm text-gray-500">
      No account? <a class="text-indigo-600 hover:underline" href="{% url 'authentication:signup' %}">Sign up</a>
    </p>
  </div>
</c-layout>

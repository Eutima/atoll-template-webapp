<c-vars page_obj="" query_param="page" />

<nav class="flex items-center justify-between px-2 py-3" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a href="?{{ query_param }}={{ page_obj.previous_page_number }}" class="text-sm text-indigo-600 hover:underline">Previous</a>
  {% else %}
    <span></span>
  {% endif %}
  <span class="text-sm text-gray-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{{ query_param }}={{ page_obj.next_page_number }}" class="text-sm text-indigo-600 hover:underline">Next</a>
  {% else %}
    <span></span>
  {% endif %}
</nav>

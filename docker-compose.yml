services:
  web:
    build:
      context: .
      target: dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  huey:
    build:
      context: .
      target: dev
    command: docker/run_worker.sh
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - web
